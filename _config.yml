# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
name: ./sysctl.id
title: ./sysctl.id
email: awcodify@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Performance engineering really help us to handle expected or even
  unexpected amount of traffic without any issue.
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://sysctl.id" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  awcodify
github: [metadata]

# Build settings
remote_theme: awcodify/arsxy-theme
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# long-haul theme config
header: normal
date_format: "%b %-d, %Y"
permalink: /:title/
sass:
    style: compressed

markdown: kramdown
highlighter: rouge
paginate: 10
paginate_path: "/page/:num/"

# Dark mode configuration
dark_mode:
  enabled: true   # If set to false, the toggle button will be hidden
  default: false  # If true, dark mode will be the default theme

# Homepage configuration
homepage:
  # Hero section configuration
  hero:
    enabled: false
    title: "Performance Engineering Insights"
    subtitle: "Explore the latest in performance optimization, DevOps, and software architecture"
    image: "hero-section.webp"
    buttons:
      - label: "GitHub"
        url: "https://github.com/awcodify/arsxy-theme"
        primary: false
  
  # About section configuration for sidebar
  about_widget:
    enabled: true
    title: "About"
    content: "<h2>Slash Your Cloud Bills by 60%! 🚀</h2> Master performance engineering techniques to optimize costs, boost efficiency, and scale smarter."
    link_text: "Get Free Assessment →"
    link_url: "https://optimize.sysctl.id/"
    
  # Featured posts settings
  featured_posts:
    enabled: true
    title: "Featured Posts"
    limit: 3
    
  # Latest articles settings
  latest_articles:
    enabled: true
    title: "Latest Articles"
    excerpt_length: 30

navigation:
    - title: About
      url: /about
    - title: Languages
      children:
      - title: English
        url: /english
      - title: Bahasa
        url: /bahasa-indonesia
    - title: Contact
      url: /contact

social:
    github: awcodify
    email: awcodify@gmail.com

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

header_pages:
  - tags.html
  - about.md
  - contact.md

header_logo:
  enabled: true
  image: "/assets/images/logo.png"
  alt: "Performance engineering insights" 
  height: 60 # Logo height in pixels
  dark_mode_class: "selective-lighten" # Options: original, inverted, selective-lighten

favicon:
  enabled: true                # Set to false to disable favicons completely
  icon16: "/assets/images/favicon/favicon-16x16.png"
  icon32: "/assets/images/favicon/favicon-32x32.png"
  apple_touch_icon: "/assets/images/favicon/apple-touch-icon.png"
  manifest: "/assets/images/favicon/site.webmanifest"
# style: terminal # dark (default), light or hacker
# listen_for_clients_preferred_style: true # false (default) or true
google_analytics: G-MLFFR89WJX
excerpt_separator: <!--more-->

# Giscus Comments (GitHub Discussions)
giscus:
  enabled: true # Set to true to enable Giscus comments
  repo: "awcodify/sysctlid" # Format: username/repo
  repo_id: "MDEwOlJlcG9zaXRvcnkzNjM4ODQ4MzI=" # Get this from running the giscus app
  category: "Blog Comment" # The discussion category
  category_id: "DIC_kwDOFbBxIM4CqQaN" # Get this from running the giscus app
  mapping: "pathname" # How to map comments to posts
  reactions_enabled: "1" # Enable reactions
  theme: "preferred_color_scheme" # Theme options: light, dark, preferred_color_scheme
  emit_metadata: "0"
  input_position: "top" # Position of the comment box
  lang: "en" # Language for the comments interface